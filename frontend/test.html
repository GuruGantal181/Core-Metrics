<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Metrics - API Smoke Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <main class="container py-4">
    <h1 class="h3">Core Metrics API Smoke Test</h1>
    <p class="text-muted">This page checks the backend endpoints without loading the main dashboard JavaScript.</p>
    <button id="refresh-test" class="btn btn-primary mb-3" type="button">Run API checks</button>
    <div id="test-status" class="alert alert-secondary" role="status">Not tested yet.</div>
    <div class="row g-3">
      <section class="col-md-6">
        <div class="card h-100">
          <div class="card-header">Users</div>
          <div class="card-body"><pre id="users-result" class="mb-0 small">—</pre></div>
        </div>
      </section>
      <section class="col-md-6">
        <div class="card h-100">
          <div class="card-header">Exercises</div>
          <div class="card-body"><pre id="exercises-result" class="mb-0 small">—</pre></div>
        </div>
      </section>
    </div>
  </main>

  <script>
    const API_BASE_URL = "http://localhost:8080/api";

    async function checkEndpoint(path) {
      const response = await fetch(`${API_BASE_URL}${path}`);
      const body = await response.json();
      if (!response.ok) {
        throw new Error(body.error || `Request failed (${response.status})`);
      }
      return body;
    }

    async function runChecks() {
      const status = document.getElementById("test-status");
      status.className = "alert alert-info";
      status.textContent = "Checking backend endpoints…";

      try {
        const [users, exercises] = await Promise.all([
          checkEndpoint("/users"),
          checkEndpoint("/exercises")
        ]);
        document.getElementById("users-result").textContent = JSON.stringify(users, null, 2);
        document.getElementById("exercises-result").textContent = JSON.stringify(exercises, null, 2);
        status.className = "alert alert-success";
        status.textContent = `API is responding. Found ${users.length} users and ${exercises.length} exercises.`;
      } catch (error) {
        status.className = "alert alert-danger";
        status.textContent = error.message || "The API smoke test failed.";
      }
    }

    document.getElementById("refresh-test").addEventListener("click", runChecks);
    runChecks();
  </script>
</body>
</html>
