<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Core Metrics - Integration Test</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Core Metrics (JS Integration Test)</h2>
  <p>BMR: <strong id="bmr-display">Loading...</strong> kcal</p>

  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Date</th>
        <th>Exercise</th>
        <th>Weight (kg)</th>
        <th>Reps</th>
        <th>Est. 1RM (kg)</th>
      </tr>
    </thead>
    <tbody id="workout-table-body"></tbody>
  </table>

  <div style="width: 600px; margin-top: 20px;">
    <canvas id="rm-chart"></canvas>
  </div>

  <h3>Log Workout (POST Test)</h3>
  <form id="log-workout-form">
    <input type="text" id="exercise-input" placeholder="Exercise" required />
    <input type="number" id="weight-input" placeholder="Weight (kg)" step="0.5" required />
    <input type="number" id="reps-input" placeholder="Reps" required />
    <button type="submit">Log Set</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
