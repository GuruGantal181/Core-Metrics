<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Metrics | Fitness & Calorie Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Core Metrics</a>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="row g-4 mb-4">
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body d-flex flex-column justify-content-center text-center">
                        <h6 class="text-muted text-uppercase mb-2">Daily BMR</h6>
                        <h1 class="display-4 fw-bold text-primary mb-0" id="bmr-display">--</h1>
                        <small class="text-muted">kcal / day</small>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title mb-3">1-Rep Max Progression</h5>
                        <canvas id="rm-chart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Log Workout</h5>
                        <form id="log-workout-form">
                            <div class="mb-3">
                                <label for="exercise-input" class="form-label">Exercise</label>
                                <select class="form-select" id="exercise-input" required>
                                    <option value="1">Bench Press</option>
                                    <option value="2">Pullups</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="weight-input" class="form-label">Weight (kg)</label>
                                <input type="number" step="0.5" min="0" class="form-control" id="weight-input" placeholder="e.g. 60" required>
                            </div>
                            <div class="mb-3">
                                <label for="reps-input" class="form-label">Reps</label>
                                <input type="number" min="1" class="form-control" id="reps-input" placeholder="e.g. 8" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Save Workout</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title mb-3">Workout History</h5>
                        <div class="table-responsive">
                            <table class="table table-striped table-hover align-middle mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>Exercise</th>
                                        <th>Weight (kg)</th>
                                        <th>Reps</th>
                                        <th>Est. 1RM (kg)</th>
                                    </tr>
                                </thead>
                                <tbody id="workout-table-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
</body>
</html>
